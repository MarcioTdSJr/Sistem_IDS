name: Pipeline CI/CD - Sistem_IDS

on:
  push:
    branches: [ "main", "feat/documentacao-ci", "feat/*" ]
  pull_request:
    branches: [ "main", "feat/documentacao-ci", "feat/*" ]

jobs:
  build-and-test-java:
    name: 1. Build e Testes Unitários (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e Executar Testes JUnit (Maven)
        working-directory: ./motor-java
        run: mvn clean test

  lint-python-simulator:
    name: 2. Validar Simulador CAN (Python 3)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar erros de sintaxe nos scripts Python
        run: python -m py_compile trafic-sim/ataque-dos.py trafic-sim/traffic-sim.py

  docker-build-validator:
    name: 3. CD - Gerar e Validar Imagens Docker
    needs: [build-and-test-java, lint-python-simulator]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Gerar Imagem Docker Otimizada (Motor Java)
        run: docker build -t sistem-ids-motor:latest ./motor-java

      - name: Gerar Imagem Docker (Simulador Python)
        run: docker build -t sistem-ids-simulador:latest ./trafic-sim

      - name: Listar Imagens Geradas com Sucesso
        run: docker images | grep sistem-ids