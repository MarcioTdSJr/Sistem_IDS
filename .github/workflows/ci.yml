name: Pipeline CI - A1 DevOps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
      - name: Fazer o checkout do código
        uses: actions/checkout@v3

      - name: Configurar o Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar e Executar Testes Automatizados
        run: |
          cd ids-engine
          javac TesteIDS.java
          java TesteIDS