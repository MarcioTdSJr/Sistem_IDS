name: Pipeline CI/CD - Sistem_IDS

on:
  push:
    branches: [ "main", "feat/*" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  # --- FASE 1: CI (Integração Contínua) ---
  build-and-test-java:
    name: 1. CI - Build e Testes Unitários (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e Executar Testes JUnit (Maven)
        working-directory: ./motor-java
        run: mvn clean test

  lint-python-simulator:
    name: 2. CI - Validar Sintaxe (Python 3)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar erros de sintaxe nos scripts Python
        run: python -m py_compile trafic-sim/ataque-dos.py trafic-sim/traffic-sim.py

  # --- FASE 2: CD (Entrega e Publicação Contínua) ---
  docker-publish-and-deploy:
    name: 3. CD - Build, Tag e Push para Container Registry
    needs: [build-and-test-java, lint-python-simulator]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Normalizar nome do repositório para minúsculas
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_JAVA=${{ env.REGISTRY }}/${REPO_LOWER}/motor-ids" >> $GITHUB_ENV
          echo "IMAGE_PYTHON=${{ env.REGISTRY }}/${REPO_LOWER}/simulador-can" >> $GITHUB_ENV

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados e Tags (Versionamento Semântico)
        id: meta-java
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_JAVA }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Gerar e Publicar Imagem Docker (Motor Java Multi-Stage)
        uses: docker/build-push-action@v5
        with:
          context: ./motor-java
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-java.outputs.tags }}

      - name: Gerar e Publicar Imagem Docker (Simulador Python)
        uses: docker/build-push-action@v5
        with:
          context: ./trafic-sim
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_PYTHON }}:latest

      - name: Simulação de Deploy em Homologação
        run: |
          echo "🚀 Simulação de Deploy em Homologação/Produção"
          echo "STATUS: Deploy realizado com sucesso!"
