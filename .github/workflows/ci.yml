name: Pipeline CI/CD - Sistem IDS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17 (Motor IDS)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Compilação e Testes Unitários (Maven / JUnit)
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean test
          elif [ -f "ids-engine/pom.xml" ]; then
            mvn -f ids-engine/pom.xml clean test
          else
            echo "Compilando arquivos Java..."
            find . -name "*.java"
          fi

      - name: 4. Configurar Python 3.10 (Simulador CAN/DoS)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 5. Validar Sintaxe dos Scripts Python
        run: |
          python -m py_compile $(find . -name "*.py")

      - name: 6. Gestão de Segredos - Login no Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 7. Build e Versionamento Semântico (SemVer)
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "Construindo imagens Docker para a release $VERSION..."
          docker compose build
          IMAGE_ID=$(docker images -q | head -n 1)
          if [ -n "$IMAGE_ID" ]; then
            docker tag $IMAGE_ID ghcr.io/marciotdsjr/sistem_ids:$VERSION
            docker tag $IMAGE_ID ghcr.io/marciotdsjr/sistem_ids:v1.0.0-stable
            echo "Imagens tagueadas com sucesso: $VERSION e v1.0.0-stable"
          fi

      - name: 8. Deploy Automático em Ambiente Simulado (CD)
        id: deploy
        run: |
          echo "Realizando deploy da versão v1.0.${{ github.run_number }}..."
          docker compose up -d
          sleep 3
          docker compose ps

      - name: 9. Fluxo de Rollback Automático (Executado em caso de falha no Deploy)
        if: failure() && steps.deploy.conclusion == 'failure'
        run: |
          echo "🚨 ERRO CRÍTICO: Falha detectada na versão v1.0.${{ github.run_number }}!"
          echo "🔄 Executando Rollback para a última versão estável (v1.0.0-stable)..."
          docker compose down
          IMAGE_STABLE="ghcr.io/marciotdsjr/sistem_ids:v1.0.0-stable"
          echo "Revertendo containers para a imagem: $IMAGE_STABLE"
          docker compose up -d
          echo "✅ Rollback finalizado com sucesso!"

      - name: 10. Limpeza do Ambiente
        if: always()
        run: docker compose down
