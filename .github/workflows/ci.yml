name: Pipeline CI - Sistem_IDS

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test-java:
    name: Build e Testes Unitários (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e Executar Testes JUnit (Maven)
        working-directory: ./motor-java
        run: mvn clean test

  lint-python-simulator:
    name: Validar Simulador CAN (Python 3)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar erros de sintaxe nos scripts Python
        run: python -m py_compile trafic-sim/ataque-dos.py trafic-sim/traffic-sim.py